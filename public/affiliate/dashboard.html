<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Dashboard - Toko Kemayoran</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    .affiliate-dashboard {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--surface);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--line);
    }
    .stat-card span {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .stat-card strong {
      font-size: 32px;
      color: var(--text);
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Referral Links List */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }
    .link-card {
      background: var(--surface);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .link-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .link-card-header h3 {
      font-size: 16px;
      font-weight: 700;
    }
    .link-badge {
      background: var(--surface-soft);
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }
    .referral-box {
      background: var(--surface-soft);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
    }
    .referral-box input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-btn {
      padding: 8px 16px;
      font-size: 13px;
    }

    /* Orders Table */
    .table-container {
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: var(--surface-soft);
      text-align: left;
      padding: 16px 24px;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    td {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    .status-pill {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-selesai { background: rgba(13, 107, 77, 0.1); color: var(--accent); }
    .status-proses { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

    .logout-btn {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="affiliate-dashboard">
    <div class="header-actions">
      <div>
        <h1 id="user-welcome">Memuat...</h1>
        <p class="muted">Monitor performa dan komisi Anda di satu tempat.</p>
      </div>
      <button id="logout-button" class="logout-btn">Keluar</button>
    </div>

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span>Total Akumulasi Komisi</span>
        <strong id="total-commission">Rp 0</strong>
      </div>
      <div class="stat-card">
        <span>Total Pesanan</span>
        <strong id="total-orders">0</strong>
      </div>
      <div class="stat-card">
        <span>Jumlah Link Aktif</span>
        <strong id="total-links">0</strong>
      </div>
    </div>

    <!-- Referral Links Section -->
    <h2 class="section-title">Link Referral Anda</h2>
    <div id="links-container" class="links-grid">
      <!-- Cards will be injected here -->
    </div>

    <!-- Orders History Section -->
    <h2 class="section-title">Riwayat Pesanan</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Tanggal</th>
            <th>Customer</th>
            <th>Kode</th>
            <th>Total</th>
            <th>Status</th>
            <th>Komisi</th>
          </tr>
        </thead>
        <tbody id="orders-tbody">
          <!-- Rows will be injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const token = sessionStorage.getItem('adminToken');
    if (!token) window.location.href = '/login.html';

    const formatCurrency = (val) => new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(val || 0);

    async function loadDashboard() {
      try {
        const [meRes, ordersRes] = await Promise.all([
          fetch('/api/affiliate/me', { headers: { 'x-admin-token': token } }),
          fetch('/api/affiliate/orders', { headers: { 'x-admin-token': token } })
        ]);

        if (!meRes.ok) throw new Error('Sesi berakhir.');
        
        const meData = await meRes.json();
        const ordersData = await ordersRes.json();

        // Update Header & Stats
        document.getElementById('user-welcome').textContent = `Halo, ${meData.user.username}`;
        
        const totalEarned = meData.affiliates.reduce((acc, curr) => acc + (curr.total_earned || 0), 0);
        const totalOrdersCount = meData.affiliates.reduce((acc, curr) => acc + (curr.total_orders || 0), 0);
        
        document.getElementById('total-commission').textContent = formatCurrency(totalEarned);
        document.getElementById('total-orders').textContent = totalOrdersCount;
        document.getElementById('total-links').textContent = meData.affiliates.length;

        // Render Links
        const linksContainer = document.getElementById('links-container');
        linksContainer.innerHTML = meData.affiliates.map(aff => `
          <div class="link-card">
            <div class="link-card-header">
              <h3>${aff.name}</h3>
              <span class="link-badge">${aff.commission_rate}% Komisi</span>
            </div>
            <div class="referral-box">
              <input type="text" readonly value="${window.location.origin}/?ref=${aff.code}">
              <button class="primary-button copy-btn" onclick="copyLink('${aff.code}')">Salin</button>
            </div>
            <div style="display:flex; justify-content: space-between; font-size: 13px;">
              <span class="muted">Kode: <strong>${aff.code}</strong></span>
              <span class="muted">Earning: <strong>${formatCurrency(aff.total_earned)}</strong></span>
            </div>
          </div>
        `).join('');

        // Render Orders
        const ordersTbody = document.getElementById('orders-tbody');
        if (ordersData.length === 0) {
          ordersTbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;" class="muted">Belum ada pesanan masuk.</td></tr>';
        } else {
          ordersTbody.innerHTML = ordersData.map(order => `
            <tr>
              <td>#${order.id.slice(0, 8)}</td>
              <td>${new Date(order.created_at).toLocaleDateString('id-ID')}</td>
              <td>${order.customer_name}</td>
              <td><span class="link-badge">${order.affiliate_code}</span></td>
              <td>${formatCurrency(order.total)}</td>
              <td><span class="status-pill status-${order.status.toLowerCase()}">${order.status}</span></td>
              <td style="font-weight:700; color: var(--accent);">${formatCurrency(order.estimatedCommission)}</td>
            </tr>
          `).join('');
        }

      } catch (err) {
        alert(err.message);
        window.location.href = '/login.html';
      }
    }

    function copyLink(code) {
      const link = `${window.location.origin}/?ref=${code}`;
      navigator.clipboard.writeText(link);
      alert('Link referral berhasil disalin!');
    }

    document.getElementById('logout-button').addEventListener('click', () => {
      sessionStorage.clear();
      window.location.href = '/login.html';
    });

    loadDashboard();
  </script>
</body>
</html>
