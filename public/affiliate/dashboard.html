<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Dashboard - Toko Kemayoran</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="/ui.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --accent: #0d6b4d;
      --accent-soft: rgba(13, 107, 77, 0.05);
      --text: #1a1a1a;
      --text-muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      line-height: 1.5;
    }

    .affiliate-dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      gap: 20px;
    }

    @media (max-width: 640px) {
      .header-actions {
        flex-direction: column;
        align-items: flex-start;
      }
      .logout-btn {
        width: 100%;
        text-align: center;
      }
    }

    #user-welcome {
      font-size: 32px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, var(--accent), #15803d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 24px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-card span {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .stat-card strong {
      font-size: 36px;
      font-weight: 800;
      color: var(--accent);
    }

    .section-title {
      font-size: 24px;
      font-weight: 800;
      margin: 48px 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Referral Links List */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .link-card {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 24px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .link-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .link-card-header h3 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .link-badge {
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .referral-box {
      background: #f1f5f9;
      padding: 14px 16px;
      border-radius: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
    }

    .referral-box input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      outline: none;
    }

    .copy-btn {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modern Card-based List Layout */
    .list-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
      gap: 16px;
    }

    .data-item-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .data-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .data-item-title {
      font-weight: 700;
      font-size: 16px;
    }

    .data-item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .data-item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
    }

    .amount-badge {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }

    .status-pill {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-selesai { background: #dcfce7; color: #15803d; }
    .status-proses { background: #dbeafe; color: #1d4ed8; }
    .status-pending { background: #fef3c7; color: #b45309; }

    .logout-btn {
      color: #ef4444;
      background: #fee2e2;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #fecaca;
    }
  </style>
</head>
<body>
  <div class="affiliate-dashboard">
    <div class="header-actions">
      <div>
        <h1 id="user-welcome">Memuat...</h1>
        <p class="muted">Monitor performa dan komisi Anda di satu tempat.</p>
      </div>
      <button id="logout-button" class="logout-btn">Keluar</button>
    </div>

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <span>Total Akumulasi Komisi</span>
        <strong id="total-commission">Rp 0</strong>
      </div>
      <div class="stat-card">
        <span>Total Pesanan</span>
        <strong id="total-orders">0</strong>
      </div>
      <div class="stat-card">
        <span>Jumlah Link Aktif</span>
        <strong id="total-links">0</strong>
      </div>
    </div>

    <!-- Referral Links Section -->
    <h2 class="section-title">Link Referral Anda</h2>
    <div id="links-container" class="links-grid">
      <!-- Cards will be injected here -->
    </div>

    <!-- Orders History Section -->
    <h2 class="section-title">Riwayat Pesanan</h2>
    <div id="orders-list" class="list-container">
      <p class="muted">Memuat data...</p>
    </div>

    <!-- Payout History Section -->
    <h2 class="section-title" style="margin-top: 48px;">Riwayat Pembayaran Komisi</h2>
    <div id="payouts-list" class="list-container">
      <p class="muted">Memuat data...</p>
    </div>
  </div>

  <script>
    const token = sessionStorage.getItem('adminToken');
    if (!token) window.location.href = '/login.html';

    const formatCurrency = (val) => new Intl.NumberFormat('id-ID', {
      style: 'currency',
      currency: 'IDR',
      maximumFractionDigits: 0
    }).format(val || 0);

    async function loadDashboard() {
      try {
        const [meRes, ordersRes, payoutsRes] = await Promise.all([
          fetch('/api/affiliate/me', { headers: { 'x-admin-token': token } }),
          fetch('/api/affiliate/orders', { headers: { 'x-admin-token': token } }),
          fetch('/api/affiliate/payouts', { headers: { 'x-admin-token': token } })
        ]);

        if (!meRes.ok) throw new Error('Sesi berakhir.');
        
        const meData = await meRes.json();
        const ordersData = await ordersRes.json();
        const payoutsData = await payoutsRes.json();

        // Update Header & Stats
        document.getElementById('user-welcome').textContent = `Halo, ${meData.user.username}`;
        
        const totalEarned = meData.affiliates.reduce((acc, curr) => acc + (curr.total_earned || 0), 0);
        const totalOrdersCount = meData.affiliates.reduce((acc, curr) => acc + (curr.total_orders || 0), 0);
        
        document.getElementById('total-commission').textContent = formatCurrency(totalEarned);
        document.getElementById('total-orders').textContent = totalOrdersCount;
        document.getElementById('total-links').textContent = meData.affiliates.length;

        // Render Links
        const linksContainer = document.getElementById('links-container');
        linksContainer.innerHTML = meData.affiliates.map(aff => `
          <div class="link-card">
            <div class="link-card-header">
              <h3>${aff.name}</h3>
              <span class="link-badge">${aff.commission_rate}% Komisi</span>
            </div>
            <div class="referral-box">
              <input type="text" readonly value="${window.location.origin}/?ref=${aff.code}">
              <button class="primary-button copy-btn" onclick="copyLink('${aff.code}')">Salin</button>
            </div>
            <div style="display:flex; justify-content: space-between; font-size: 13px;">
              <span class="muted">Kode: <strong>${aff.code}</strong></span>
              <span class="muted">Earning: <strong>${formatCurrency(aff.total_earned)}</strong></span>
            </div>
          </div>
        `).join('');

        // Render Orders
        const ordersList = document.getElementById('orders-list');
        if (ordersData.length === 0) {
          ordersList.innerHTML = '<div class="data-item-card" style="text-align:center;"><p class="muted">Belum ada pesanan masuk.</p></div>';
        } else {
          ordersList.innerHTML = ordersData.map(order => `
            <div class="data-item-card">
              <div class="data-item-header">
                <span class="data-item-title">${order.customer_name}</span>
                <span class="status-pill status-${order.status.toLowerCase()}">${order.status}</span>
              </div>
              <div class="data-item-meta">
                <span>ID: #${order.id.slice(0, 8)}</span>
                <span>${new Date(order.created_at).toLocaleDateString('id-ID')}</span>
                <span>Kode: <span class="link-badge">${order.affiliate_code}</span></span>
              </div>
              <div class="data-item-footer">
                <span class="muted">Komisi Estimasi</span>
                <span class="amount-badge">${formatCurrency(order.estimatedCommission)}</span>
              </div>
            </div>
          `).join('');
        }

        // Render Payouts
        const payoutsList = document.getElementById('payouts-list');
        if (payoutsData.length === 0) {
          payoutsList.innerHTML = '<div class="data-item-card" style="text-align:center;"><p class="muted">Belum ada riwayat pembayaran komisi.</p></div>';
        } else {
          payoutsList.innerHTML = payoutsData.map(p => `
            <div class="data-item-card">
              <div class="data-item-header">
                <span class="data-item-title">Pembayaran Komisi</span>
                <span class="link-badge">${p.affiliates.code}</span>
              </div>
              <div class="data-item-meta">
                <span>${new Date(p.paid_at).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' })}</span>
                <span>Catatan: ${p.notes || 'Payout Admin'}</span>
              </div>
              <div class="data-item-footer">
                <span class="muted">Jumlah Dibayar</span>
                <span class="amount-badge">${formatCurrency(p.amount)}</span>
              </div>
            </div>
          `).join('');
        }

      } catch (err) {
        showNotification(err.message, "error");
        window.location.href = '/login.html';
      }
    }

    function copyLink(code) {
      const link = `${window.location.origin}/?ref=${code}`;
      navigator.clipboard.writeText(link);
      showNotification('Link referral berhasil disalin!', 'success');
    }

    document.getElementById('logout-button').addEventListener('click', () => {
      sessionStorage.clear();
      window.location.href = '/login.html';
    });

    loadDashboard();
  </script>
</body>
</html>
