<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Toko Kemayoran</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      border: 1px solid var(--line);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      font-family: inherit;
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(13, 107, 77, 0.1);
    }
    .login-button {
      width: 100%;
      margin-top: 12px;
    }
    #error-message {
      color: #ef4444;
      font-size: 14px;
      text-align: center;
      margin-top: 16px;
      min-height: 20px;
    }
    .back-to-store {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-to-store:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Masuk Akun</h1>
        <p class="muted">Silakan masukkan akun Anda.</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username / Kode Affiliate</label>
          <input type="text" id="username" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submit-btn" class="primary-button login-button">Masuk</button>
        <p id="error-message"></p>
      </form>
    </div>
    <a href="/" class="back-to-store">← Kembali ke Toko</a>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      errorMessage.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.message || 'Login gagal.');
        }
        
        // Save token and role
        sessionStorage.setItem('adminToken', data.token); // Keep using this key for backward compatibility or refactor later
        sessionStorage.setItem('userRole', data.role);
        
        // Redirect based on role
        if (data.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/affiliate/dashboard.html';
        }
      } catch (err) {
        errorMessage.textContent = err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
